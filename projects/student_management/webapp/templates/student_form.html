{% extends 'base.html' %}
{% block title %}{{ 'Edit Student' if student else 'Add Student' }}{% endblock %}
{% block content %}
<h1>{{ 'Edit Student' if student else 'Add Student' }}</h1>
<form method="POST">
    <div class="mb-3">
        <label for="name" class="form-label">Full Name *</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ student.name if student else '' }}" required>
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" value="{{ student.email if student else '' }}">
    </div>
    <div class="mb-3">
        <label for="phone" class="form-label">Phone</label>
        <input type="text" class="form-control" id="phone" name="phone" value="{{ student.phone if student else '' }}">
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('main.list_students') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
