{% extends 'base.html' %}
{% block title %}{{ 'Edit Transaction' if transaction else 'Add Transaction' }}{% endblock %}
{% block content %}
<h1>{{ 'Edit Transaction' if transaction else 'Add Transaction' }}</h1>
<form method="POST">
    <div class="row g-3">
        <div class="col-md-6">
            <label for="account_id" class="form-label">Account *</label>
            <select class="form-select" id="account_id" name="account_id" required>
                <option value="">Select account...</option>
                {% for a in accounts %}
                <option value="{{ a.id }}" {{ 'selected' if transaction and transaction.account_id == a.id else '' }}>{{ a.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6">
            <label for="type" class="form-label">Type *</label>
            <select class="form-select" id="type" name="type" required>
                <option value="expense" {{ 'selected' if transaction and transaction.type == 'expense' else '' }}>Expense</option>
                <option value="income" {{ 'selected' if transaction and transaction.type == 'income' else '' }}>Income</option>
            </select>
        </div>
        <div class="col-md-6">
            <label for="category_id" class="form-label">Category</label>
            <select class="form-select" id="category_id" name="category_id">
                <option value="">Uncategorized</option>
                {% for c in categories %}
                <option value="{{ c.id }}" {{ 'selected' if transaction and transaction.category_id == c.id else '' }}>
                    {{ c.name }} ({{ c.type }})
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6">
            <label for="amount" class="form-label">Amount *</label>
            <input type="number" step="0.01" class="form-control" id="amount" name="amount"
                   value="{{ transaction.amount if transaction else '' }}" required>
        </div>
        <div class="col-md-6">
            <label for="date" class="form-label">Date *</label>
            <input type="date" class="form-control" id="date" name="date"
                   value="{{ transaction.date if transaction else '' }}" required>
        </div>
        <div class="col-md-6">
            <label for="description" class="form-label">Description</label>
            <input type="text" class="form-control" id="description" name="description"
                   value="{{ transaction.description if transaction else '' }}">
        </div>
    </div>
    <button type="submit" class="btn btn-primary mt-3">Save</button>
    <a href="{{ url_for('transactions.list_transactions') }}" class="btn btn-secondary mt-3">Cancel</a>
</form>
{% endblock %}
