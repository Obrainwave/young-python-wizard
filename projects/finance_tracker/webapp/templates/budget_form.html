{% extends 'base.html' %}
{% block title %}{{ 'Edit Budget' if budget else 'Set Budget' }}{% endblock %}
{% block content %}
<h1>{{ 'Edit Budget' if budget else 'Set Budget' }}</h1>
<form method="POST">
    <div class="mb-3">
        <label for="category_id" class="form-label">Expense Category *</label>
        <select class="form-select" id="category_id" name="category_id" required>
            <option value="">Select a category...</option>
            {% for c in expense_categories %}
            <option value="{{ c.id }}" {{ 'selected' if budget and budget.category_id == c.id else '' }}>{{ c.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="month" class="form-label">Month *</label>
        <input type="month" class="form-control" id="month" name="month"
               value="{{ budget.month if budget else default_month }}" required>
    </div>
    <div class="mb-3">
        <label for="amount" class="form-label">Budget Amount *</label>
        <input type="number" step="0.01" class="form-control" id="amount" name="amount"
               value="{{ budget.amount if budget else '' }}" required>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('budgets.list_budgets') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
