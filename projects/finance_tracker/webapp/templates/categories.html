{% extends 'base.html' %}
{% block title %}Categories{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Categories</h1>
    <a href="{{ url_for('categories.add_category') }}" class="btn btn-primary">+ Add Category</a>
</div>

{% if categories %}
<table class="table table-striped">
    <thead>
        <tr><th>Color</th><th>Name</th><th>Type</th><th>Actions</th></tr>
    </thead>
    <tbody>
        {% for c in categories %}
        <tr>
            <td><span class="badge" style="background: {{ c.color }};">&nbsp;&nbsp;&nbsp;&nbsp;</span></td>
            <td>{{ c.name }}</td>
            <td class="text-capitalize">{{ c.type }}</td>
            <td>
                <a href="{{ url_for('categories.edit_category', category_id=c.id) }}" class="btn btn-sm btn-warning">Edit</a>
                <form action="{{ url_for('categories.delete_category', category_id=c.id) }}" method="POST" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-danger"
                            onclick="return confirm('Deleting this category will unlink its transactions and remove its budgets. Continue?')">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<p>No categories yet.</p>
{% endif %}
{% endblock %}
