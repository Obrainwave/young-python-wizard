{% extends 'base.html' %}
{% block title %}Admin{% endblock %}
{% block content %}
<h1>Admin Panel</h1>
<a href="{{ url_for('main.add_project') }}" class="btn btn-primary mb-3">Add New Project</a>
<table class="table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Featured</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for project in projects %}
        <tr>
            <td>{{ project.id }}</td>
            <td>{{ project.title }}</td>
            <td>{{ 'Yes' if project.featured else 'No' }}</td>
            <td>
                <a href="{{ url_for('main.edit_project', project_id=project.id) }}" class="btn btn-sm btn-warning">Edit</a>
                <form action="{{ url_for('main.delete_project', project_id=project.id) }}" method="POST" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
